<style>

*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Libre Baskerville',Georgia,serif;font-size:14px}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}.mono{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase}.muted{color:var(--muted)}.brand{display:flex;align-items:center;gap:12px;font-weight:bold}.bookmark{width:23px;height:31px;background:#e9e4d7;border-radius:3px 3px 5px 5px;display:inline-block}.brand small{display:block;font:11px 'DM Mono',monospace;color:#aaa398;letter-spacing:.04em;margin-top:3px}.auth-layout{min-height:100vh;display:grid;grid-template-columns:minmax(280px,27.5%) 1fr}.hero{background:#191713;color:#f5f0e5;padding:38px 36px;display:flex;flex-direction:column;justify-content:space-between;min-height:100vh}.hero-copy{max-width:310px;margin:auto 0}.hero h1{font-size:34px;line-height:1.32;font-weight:400;margin:0 0 22px}.hero h1 em{color:#aaa196}.hero p{color:#8f887d;line-height:1.8;font-size:13px}.demo-list{display:grid;gap:10px;margin-top:32px}.demo{border:1px solid #39352d;border-radius:9px;padding:13px 15px;color:#a9a196;background:transparent;text-align:left}.demo:hover{border-color:#857968;background:#24211b}.demo strong{display:block;font:11px 'DM Mono',monospace;letter-spacing:.08em;margin-bottom:7px;color:#c6beb1}.auth-main{padding:30px 24px;display:flex;justify-content:center;align-items:flex-start;overflow:auto}.auth-card{width:min(100%,450px);padding:0 0 30px}.tabs{display:grid;grid-template-columns:1fr 1fr;margin-bottom:32px;border-bottom:1px solid var(--line)}.tab{background:transparent;border:0;padding:0 10px 14px;color:#b3aa9c}.tab.active{border-bottom:2px solid var(--green);color:#29251f}.auth-card h2{font-size:27px;font-weight:400;margin:0 0 7px}.intro{color:var(--muted);line-height:1.6;margin:0 0 26px}.role-options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:25px 0 20px}.role-options.two{grid-template-columns:repeat(2,1fr)}.role{background:#fff;border:2px solid var(--line);border-radius:11px;padding:18px 6px;min-height:82px;text-align:center;color:#39342c}.role .glyph{display:block;font-size:18px;margin-bottom:8px}.role.selected{background:var(--brown);border-color:#855a37;color:white;box-shadow:0 4px 10px #0001}.role.teacher.selected{background:var(--blue);border-color:#38628c}.role.admin.selected{background:var(--green);border-color:#496d3a}.role-label{font:11px 'DM Mono',monospace;letter-spacing:.12em}.role-note{border:1px solid #d0c8b8;border-radius:8px;padding:13px 15px;background:#e8e2d5;line-height:1.7;font-size:12px;margin-bottom:20px}.google,.primary,.secondary,.filter{border:1px solid var(--line);border-radius:4px;background:white;padding:12px 14px;color:#342e26}.google{width:100%;margin-bottom:20px}.google b{color:#4285f4;margin-right:12px;font-family:Arial}.or{display:flex;align-items:center;gap:12px;color:#b2a998;margin:0 0 23px}.or:before,.or:after{content:"";height:1px;background:var(--line);flex:1}.field{display:block;margin-bottom:17px}.field span{display:block;margin-bottom:8px;color:#82796d}.field input,.search-input,.field select{width:100%;padding:13px 14px;border:1px solid #d3cbbb;border-radius:4px;background:#fff;color:#25211c;outline:none}.field input:focus,.search-input:focus{border-color:#81745f;box-shadow:0 0 0 2px #81745f20}.hint{font-size:11px;color:var(--muted);margin-top:-8px;margin-bottom:16px;line-height:1.5}.primary{background:var(--brown);color:white;border-color:var(--brown);width:100%;font:500 12px 'DM Mono',monospace;padding:14px}.primary.teacher{background:var(--blue);border-color:var(--blue)}.primary.admin{background:var(--green);border-color:var(--green)}.primary:hover{filter:brightness(1.08)}.auth-foot{text-align:center;font-size:11px;color:#aaa092;margin-top:24px;line-height:1.8}.error,.success{padding:11px 13px;border-radius:5px;margin-bottom:15px;font-size:12px;line-height:1.5}.error{background:#f6e8eb;color:#6d2340}.success{background:#e8f0e4;color:#2e4b23}.hidden{display:none!important}
/* app */
.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:240px;background:#191713;color:#e9e3d8;display:flex;flex-direction:column;z-index:5}.sidebar .brand{padding:24px 24px 23px;border-bottom:1px solid #39352d}.nav{padding:14px 12px;border-bottom:1px solid #39352d}.nav button{width:100%;text-align:left;background:transparent;border:0;color:#a9a196;padding:12px 13px;border-radius:5px;margin:2px 0}.nav button.active,.nav button:hover{background:#302d27;color:white}.nav button .count{float:right;background:var(--rose);color:white;border-radius:3px;padding:2px 6px}.sidebar-bottom{margin-top:auto;padding:18px 24px 24px;border-top:1px solid #39352d}.user-avatar{display:flex;align-items:center;gap:10px;margin-bottom:20px}.avatar{width:29px;height:29px;border-radius:50%;background:var(--brown);color:white;display:grid;place-items:center;font:11px 'DM Mono',monospace;flex-shrink:0}.avatar.teacher{background:var(--blue)}.avatar.admin{background:var(--green)}.user-avatar small{display:block;color:#9e968a;margin-top:4px;font-size:11px}.signout{border:0;background:none;color:#9b9387;padding:0}.topbar{height:68px;position:fixed;top:0;right:0;left:240px;border-bottom:1px solid var(--line);background:var(--paper);display:flex;justify-content:flex-end;align-items:center;padding:0 30px;z-index:4}.topuser{display:flex;align-items:center;gap:10px}.topuser .name{text-align:right}.topuser small{display:block;color:#a49a8c;margin-top:3px}.main{margin-left:240px;padding:100px 5.8% 60px;max-width:1800px}.page-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:27px}.page-heading h1{font-weight:400;font-size:29px;margin:0 0 7px}.page-heading p{color:var(--muted);margin:0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}.search-input{flex:1;min-width:210px;max-width:650px}.filter{padding:10px 14px;font:11px 'DM Mono',monospace}.filter.active{background:var(--green);color:white;border-color:var(--green)}.table-wrap{background:#fff;border:1px solid var(--line);border-radius:9px;overflow:auto}.data-table{width:100%;border-collapse:collapse;min-width:690px}.data-table th{background:#faf9f5;text-align:left;padding:14px 18px;color:#746c60;font:500 11px 'DM Mono',monospace;letter-spacing:.08em}.data-table td{padding:14px 18px;border-top:1px solid #ece7dc;vertical-align:middle}.data-table tbody tr:hover{background:#fcfbf8}.bookcell{display:flex;align-items:center;gap:13px;min-width:240px}.bookcover{width:40px;height:56px;border-radius:3px;background:#5c391d;box-shadow:inset -3px 0 #0001,0 2px 2px #0002;flex-shrink:0;position:relative}.bookcover:after{content:"";position:absolute;bottom:5px;left:5px;right:5px;border-bottom:1px solid #ffffff45}.genre,.status{font:11px 'DM Mono',monospace;background:#f0ece2;color:#766d60;border-radius:3px;padding:4px 7px;white-space:nowrap}.status.ok{background:#e8f0e4;color:#35512c}.status.loan,.status.overdue{background:#f4e9ed;color:#6d2340}.status.hold{background:#f5efd9;color:#7a6528}.actions{display:flex;gap:6px;flex-wrap:wrap}.small-btn{border:1px solid var(--line);background:#fff;border-radius:4px;padding:7px 9px;font:10px 'DM Mono',monospace}.small-btn:hover{background:#f3efe3}.small-btn.danger{color:#6d2340}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px}.card h3{font-size:16px;font-weight:400;margin:0 0 8px}.card p{line-height:1.7;color:var(--muted);font-size:12px}.card-head{display:flex;justify-content:space-between;gap:12px}.policy{margin-top:24px;background:#f5efd9;border:1px solid #ded2ae;border-radius:8px;padding:20px;color:#786633;line-height:1.8}.policy p{color:#665b49;margin:8px 0 0}.empty{padding:36px;text-align:center;color:var(--muted)}.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:25px}.stat{padding:18px;background:white;border:1px solid var(--line);border-radius:8px}.stat .num{font-size:28px;margin:10px 0 4px}.stat .label{font:11px 'DM Mono',monospace;color:var(--muted);text-transform:uppercase}.modal-backdrop{position:fixed;inset:0;background:#17140f99;z-index:20;display:grid;place-items:center;padding:20px}.modal{background:var(--paper);border:1px solid var(--line);border-radius:9px;width:min(100%,480px);padding:25px}.modal h2{font-weight:400;margin:0 0 20px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.modal-actions .primary{width:auto}.toast{position:fixed;bottom:22px;right:22px;z-index:50;background:#24211b;color:white;padding:14px 18px;border-radius:5px;box-shadow:0 5px 20px #0002;max-width:340px;line-height:1.5}.verify-box{border:1px solid var(--line);background:white;border-radius:8px;padding:18px;margin:15px 0}.verify-code{font:20px 'DM Mono',monospace;letter-spacing:.35em;margin-top:8px}.footer-note{font-size:11px;color:#a99f91;text-align:center;margin-top:26px}
@media(max-width:850px){:root{--sidebar:0}.auth-layout{grid-template-columns:1fr}.hero{min-height:auto;padding:22px 24px}.hero-copy{display:none}.demo-list{display:none}.auth-main{padding:26px 20px}.sidebar{width:72px}.sidebar .brand{padding:20px 24px}.sidebar .brand-text,.nav button .nav-text,.sidebar-bottom .user-label,.sidebar-bottom .signout-text{display:none}.nav{padding:12px 7px}.nav button{font-size:0;text-align:center;padding:13px 5px}.nav button:first-letter{font-size:16px}.sidebar-bottom{padding:14px 20px}.sidebar-bottom .user-avatar{justify-content:center}.sidebar-bottom .user-avatar>div:last-child{display:none}.topbar{left:72px;padding:0 16px}.main{margin-left:72px;padding:95px 18px 40px}.data-table{min-width:650px}}
@media(max-width:520px){.role-options{gap:6px}.role{min-height:75px;padding:14px 3px}.role-label{font-size:9px}.page-heading{display:block}.page-heading .small-btn{margin-top:15px}.main{padding-left:12px;padding-right:12px}.topbar{height:60px}.main{padding-top:86px}.hero .brand{font-size:13px}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal-root"></div><div id="toast-root"></div>
<script>
const BOOKS = [
{id:'B001',title:'The Name of the Rose',author:'Umberto Eco',genre:'Mystery',year:1980,total:3,cover:'#4c3829'},
{id:'B002',title:'Middlemarch',author:'George Eliot',genre:'Fiction',year:1871,total:2,cover:'#2f4b24'},
{id:'B003',title:'The Anatomy of Melancholy',author:'Robert Burton',genre:'Philosophy',year:1621,total:1,cover:'#5d3a1e'},
{id:'B004',title:'Invisible Cities',author:'Italo Calvino',genre:'Fiction',year:1972,total:4,cover:'#203f61'},
{id:'B005',title:'The Order of Things',author:'Michel Foucault',genre:'Philosophy',year:1966,total:2,cover:'#70233f'},
{id:'B006',title:'Borges: Collected Fictions',author:'Jorge Luis Borges',genre:'Fiction',year:1998,total:3,cover:'#385b2e'},
{id:'B007',title:'The Peregrine',author:'J.A. Baker',genre:'Nature',year:1967,total:2,cover:'#4b5a3b'},
{id:'B008',title:'Austerlitz',author:'W.G. Sebald',genre:'Fiction',year:2001,total:1,cover:'#3b3b5c'},
{id:'B009',title:'The Master and Margarita',author:'Mikhail Bulgakov',genre:'Fiction',year:1967,total:3,cover:'#602b36'},
{id:'B010',title:'Pilgrim at Tinker Creek',author:'Annie Dillard',genre:'Nature',year:1974,total:2,cover:'#3b5a3c'},
{id:'B011',title:'Camera Lucida',author:'Roland Barthes',genre:'Philosophy',year:1980,total:1,cover:'#5d4d2c'},
{id:'B012',title:'My Brilliant Friend',author:'Elena Ferrante',genre:'Fiction',year:2011,total:4,cover:'#602c2e'}
];
const DEMOS={Student:{name:'Callum Firth',email:'c.firth@yahoo.co.uk',password:'student123',role:'Student'},Teacher:{name:'Prof. Jan Horáček',email:'j.horacek@academy.cz',password:'teacher123',role:'Teacher'},Admin:{name:'A. Lister',email:'a.lister@aldersgate.lib',password:'admin123',role:'Admin'}};
const COLORS={Student:'',Teacher:'teacher',Admin:'admin'};
let state={screen:'auth',authTab:'signin',role:'Student',user:null,section:'Catalog',genre:'All',query:'',loanFilter:'All Loans',message:'',verifyEmail:'',verifyCode:'273549',pendingUser:null};
function read(key,def){try{return JSON.parse(localStorage.getItem('aldersgate_'+key))??def}catch{return def}}
function write(key,val){localStorage.setItem('aldersgate_'+key,JSON.stringify(val))}
let users=read('users',Object.values(DEMOS));
let loans=read('loans',[
{id:'C008',bookId:'B004',member:'Callum Firth',email:DEMOS.Student.email,checked:'2026-09-18',due:'2026-10-02',status:'On Loan'},
{id:'C002',bookId:'B005',member:'Prof. Jan Horáček',email:DEMOS.Teacher.email,checked:'2026-08-27',due:'2026-09-10',status:'Overdue'}
]);
let holds=read('holds',[{id:'H001',bookId:'B008',member:'Prof. Jan Horáček',email:DEMOS.Teacher.email,reserved:'2026-09-15',expires:'2026-09-22',status:'Hold'}]);
function persist(){write('users',users);write('loans',loans);write('holds',holds)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initials(n){return n.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function roleColor(){return COLORS[state.role]||''}
function toast(msg){const r=document.getElementById('toast-root');r.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>r.innerHTML='',3000)}
function bookBy(id){return BOOKS.find(b=>b.id===id)||BOOKS[0]}
function bookLoans(id){return loans.filter(l=>l.bookId===id&&l.status!=='Returned').length}
function available(b){return Math.max(0,b.total-bookLoans(b.id))}
function statusTag(s){let cls=s==='Overdue'?'overdue':s==='On Loan'?'loan':s==='Hold'?'hold':'ok';return `<span class="status ${cls}">${esc(s)}</span>`}
function showAuth(tab='signin'){state.screen='auth';state.authTab=tab;state.user=null;render()}
function render(){const root=document.getElementById('root');root.innerHTML=state.screen==='auth'?authView():state.screen==='verify'?verifyView():appView();bind()}
function authView(){let create=state.authTab==='create';let roles=create?['Student','Teacher']:['Student','Teacher','Admin'];return `<div class="auth-layout"><aside class="hero"><div class="brand"><span class="bookmark"></span><span>Aldersgate<small>Municipal Library</small></span></div><div class="hero-copy"><h1>Knowledge<br><em>preserved,</em><br>shared freely.</h1><p>Serving the community of Aldersgate since 1882. Sign in to access the library system.</p></div><div class="demo-list">${Object.values(DEMOS).map(d=>`<button class="demo" data-demo="${d.role}"><strong>◈ &nbsp;${d.role.toUpperCase()}</strong><span class="mono" style="text-transform:none;letter-spacing:0">${d.email} · ${d.password}</span></button>`).join('')}<p class="mono" style="color:#777066">Demo credentials — click a role card to pre-fill</p></div></aside><main class="auth-main"><section class="auth-card"><div class="tabs"><button class="tab ${!create?'active':''}" data-tab="signin">SIGN IN</button><button class="tab ${create?'active':''}" data-tab="create">CREATE ACCOUNT</button></div><h2>${create?'Join the library':'Welcome back'}</h2><p class="intro">${create?'Create a verified student or teacher account.':'Choose your role, then enter your credentials.'}</p><div class="role-options ${create?'two':''}">${roles.map(r=>`<button class="role ${state.role===r?'selected':''} ${r.toLowerCase()}" data-role="${r}"><span class="glyph">${r==='Student'?'◌':r==='Teacher'?'◉':'◈'}</span><span class="role-label">${r.toUpperCase()}</span></button>`).join('')}</div><div class="role-note"><span class="mono">${state.role}</span> — ${state.role==='Student'?'Browse the catalog and view your own checkouts.':state.role==='Teacher'?'Browse the catalog, manage your own loans, and place reservations for yourself and your students.':'Full access to all library functions, member management, and system configuration.'}</div><button class="google" id="google"><b>G</b> Continue with Google <small class="muted">(demo)</small></button><div class="or mono">OR USE EMAIL</div><form id="auth-form">${create?`<label class="field"><span class="mono">FULL NAME</span><input name="name" required placeholder="Your full name"></label>`:''}<label class="field"><span class="mono">EMAIL ADDRESS</span><input name="email" type="email" required placeholder="your@email.com" value="${create?'':esc(state.email||'')}"></label><label class="field"><span class="mono">PASSWORD</span><input name="password" type="password" required placeholder="••••••••" ${create?'minlength="8"':''}></label>${create?`<p class="hint">At least 8 characters with uppercase, lowercase, and a number.</p><label class="field"><span class="mono">CONFIRM PASSWORD</span><input name="confirm" type="password" required placeholder="Repeat password"></label>`:''}<div id="auth-error"></div><button class="primary ${roleColor()}" type="submit">${create?'Create '+state.role.toLowerCase()+' account':'Sign in as '+state.role.toLowerCase()}</button></form><div class="auth-foot">Protected with two-step verification. Admin accounts are invitation only.<br><br>Aldersgate Municipal Library · Est. 1882</div></section></main></div>`}
function verifyView(){return `<div class="auth-layout"><aside class="hero"><div class="brand"><span class="bookmark"></span><span>Aldersgate<small>Municipal Library</small></span></div><div class="hero-copy"><h1>Knowledge<br><em>preserved,</em><br>shared freely.</h1><p>Serving the community of Aldersgate since 1882. Sign in to access the library system.</p></div><div class="demo-list">${Object.values(DEMOS).map(d=>`<button class="demo"><strong>${d.role.toUpperCase()}</strong><span class="mono">${d.email} · ${d.password}</span></button>`).join('')}</div></aside><main class="auth-main"><section class="auth-card" style="padding-top:70px"><button class="secondary" id="back-signin">← Back to sign in</button><div style="margin:28px 0 20px;color:var(--green);font-size:28px">✓</div><div class="mono">ONE MORE STEP</div><h2 style="margin-top:12px">Verify it’s you</h2><p class="intro">We sent a six-digit security code to ${esc(state.verifyEmail)}.</p><form id="verify-form"><label class="field"><span class="mono">SECURITY CODE</span><input name="code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required placeholder="0 0 0 0 0 0" style="text-align:center;font:20px 'DM Mono';letter-spacing:.35em"></label><div class="verify-box"><div class="mono">DEMO VERIFICATION CODE</div><div class="verify-code">${state.verifyCode}</div><button class="small-btn" type="button" id="resend" style="float:right;margin-top:-28px">Resend</button><div style="clear:both"></div></div><div id="verify-error"></div><button class="primary ${COLORS[state.pendingUser?.role]||''}" type="submit">Verify and continue</button></form><p class="auth-foot">Codes expire after 10 minutes. For this prototype, the code is shown above.</p></section></main></div>`}
function appView(){let u=state.user,admin=u.role==='Admin';let nav=[['Catalog','▤'],['Checkouts','↳'],...(admin?[['Members','♙'],['Reservations','◷'],['Manage Books','＋'],['System','⚙']]:u.role==='Teacher'?[['Reservations','◷']]:[])];let overdue=loans.filter(l=>l.email===u.email&&l.status==='Overdue').length;return `<div class="app"><aside class="sidebar"><div class="brand"><span class="bookmark"></span><span class="brand-text">Aldersgate<small>Municipal Library</small></span></div><nav class="nav">${nav.map(([n,ic])=>`<button class="${state.section===n?'active':''}" data-section="${n}">${ic} &nbsp; <span class="nav-text">${n}</span>${n==='Checkouts'&&overdue?`<span class="count">${overdue}</span>`:''}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="user-avatar"><span class="avatar ${COLORS[u.role]}">${initials(u.name)}</span><div>${esc(u.name)}<small>${u.role}</small></div></div><button class="signout" id="signout">← <span class="signout-text">Sign out</span></button></div></aside><header class="topbar"><div class="topuser"><span class="avatar ${COLORS[u.role]}">${initials(u.name)}</span><div class="name">${esc(u.name)}<small class="mono">${u.role}</small></div></div></header><main class="main">${sectionView()}</main></div>`}
function sectionView(){let u=state.user;switch(state.section){case'Catalog':return catalogView();case'Checkouts':return loansView();case'Reservations':return reservationsView();case'Members':return membersView();case'Manage Books':return manageBooksView();case'System':return systemView();default:return catalogView()}}
function catalogView(){let q=state.query.toLowerCase(),items=BOOKS.filter(b=>(state.genre==='All'||b.genre===state.genre)&&(!q||(b.title+' '+b.author).toLowerCase().includes(q)));return `<div class="page-heading"><div><h1>Catalog</h1><p>12 titles · 29 volumes</p></div>${state.user.role==='Admin'?'<button class="small-btn" data-section="Manage Books">＋ Manage catalog</button>':''}</div><div class="toolbar"><input class="search-input" id="search" placeholder="Search by title or author..." value="${esc(state.query)}">${['All','Fiction','Philosophy','Nature','Mystery'].map(g=>`<button class="filter ${state.genre===g?'active':''}" data-genre="${g}">${g}</button>`).join('')}</div><div class="table-wrap"><table class="data-table"><thead><tr><th>TITLE</th><th>AUTHOR</th><th>GENRE</th><th>YEAR</th><th>AVAILABILITY</th>${state.user.role==='Admin'?'<th>ACTIONS</th>':''}</tr></thead><tbody>${items.length?items.map(b=>`<tr><td><div class="bookcell"><span class="bookcover" style="background:${b.cover}"></span><span>${esc(b.title)}</span></div></td><td>${esc(b.author)}</td><td><span class="genre">${b.genre}</span></td><td>${b.year}</td><td>${available(b)>0?`<span class="status ok">${available(b)}/${b.total}</span>`:statusTag('On Loan')}</td>${state.user.role==='Admin'?`<td><button class="small-btn" data-book-detail="${b.id}">Manage</button></td>`:''}</tr>`).join(''):`<tr><td colspan="6" class="empty">No titles match your search.</td></tr>`}</tbody></table></div>`}
function loansView(){let u=state.user,own=loans.filter(l=>u.role==='Admin'||l.email===u.email),shown=own.filter(l=>state.loanFilter==='All Loans'||(state.loanFilter==='Overdue'&&l.status==='Overdue'));return `<div class="page-heading"><div><h1>${u.role==='Admin'?'All Checkouts':'My Loans'}</h1><p>${own.filter(l=>l.status!=='Returned').length} active loan${own.filter(l=>l.status!=='Returned').length===1?'':'s'}${u.role!=='Admin'?' for '+esc(u.name):''}</p></div>${u.role==='Admin'?'<button class="small-btn" id="new-loan">＋ Check out book</button>':''}</div><div class="toolbar"><button class="filter ${state.loanFilter==='All Loans'?'active':''}" data-loan-filter="All Loans">All Loans</button><button class="filter ${state.loanFilter==='Overdue'?'active':''}" data-loan-filter="Overdue">Overdue (${own.filter(l=>l.status==='Overdue').length})</button>${u.role==='Admin'?'<button class="filter" data-loan-filter="Returned">Returned</button>':''}</div><div class="table-wrap"><table class="data-table"><thead><tr><th>ID</th><th>BOOK</th><th>MEMBER</th><th>CHECKED OUT</th><th>DUE</th><th>STATUS</th>${u.role==='Admin'?'<th>ACTION</th>':''}</tr></thead><tbody>${shown.filter(l=>state.loanFilter!=='Returned'||l.status==='Returned').length?shown.filter(l=>state.loanFilter!=='Returned'||l.status==='Returned').map(l=>`<tr style="${l.status==='Overdue'?'background:#fff6f8':''}"><td class="mono muted">${l.id}</td><td>${esc(bookBy(l.bookId).title)}</td><td>${esc(l.member)}</td><td class="mono">${l.checked}</td><td class="mono" style="${l.status==='Overdue'?'color:var(--rose);font-weight:bold':''}">${l.due}</td><td>${statusTag(l.status)}</td>${u.role==='Admin'?`<td><button class="small-btn" data-return="${l.id}">${l.status==='Returned'?'Returned':'Return'}</button></td>`:''}</tr>`).join(''):`<tr><td colspan="7" class="empty">No loans in this view.</td></tr>`}</tbody></table></div>`}
function reservationsView(){let u=state.user,own=holds.filter(h=>u.role==='Admin'||h.email===u.email);return `<div class="page-heading"><div><h1>Reservations</h1><p>${own.filter(h=>h.status==='Hold').length} active holds</p></div></div>${own.length?`<div class="cards">${own.map(h=>`<article class="card"><div class="card-head"><div><h3>${esc(bookBy(h.bookId).title)}</h3><div class="muted">${esc(h.member)}</div></div>${statusTag(h.status)}</div><hr style="border:0;border-top:1px solid #ece7dc;margin:18px 0"><div class="mono muted" style="text-transform:none;letter-spacing:0">Reserved ${h.reserved}</div><div class="mono" style="margin-top:8px;text-transform:none;letter-spacing:0">Expires ${h.expires}</div><div style="text-align:right;margin-top:14px"><button class="small-btn danger" data-cancel-hold="${h.id}">Cancel</button></div></article>`).join('')}</div>`:'<div class="table-wrap"><div class="empty">No reservations yet. Find a title in the catalog to place a hold.</div></div>'}<div class="policy"><strong>Reservation Policy</strong><p>Holds are active for 7 days after a title becomes available. Members are notified when their reserved copy is ready for collection. Expired holds are automatically cancelled and re-queued.</p></div>`}
function membersView(){return `<div class="page-heading"><div><h1>Members</h1><p>${users.length} registered accounts</p></div></div><div class="toolbar"><input id="member-search" class="search-input" placeholder="Search by name or email..."></div><div class="table-wrap"><table class="data-table"><thead><tr><th>MEMBER</th><th>EMAIL</th><th>ROLE</th><th>ACTIVE LOANS</th><th>ACTION</th></tr></thead><tbody id="members-body">${memberRows(users)}</tbody></table></div>`}
function memberRows(list){return list.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td><span class="genre">${u.role}</span></td><td>${loans.filter(l=>l.email===u.email&&l.status!=='Returned').length}</td><td>${u.role==='Admin'?'<span class="muted">Protected</span>':`<button class="small-btn danger" data-remove-member="${esc(u.email)}">Remove</button>`}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No members found.</td></tr>'}
function manageBooksView(){return `<div class="page-heading"><div><h1>Manage Books</h1><p>Catalog inventory · ${BOOKS.length} titles</p></div><button class="small-btn" id="add-book">＋ Add title</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>TITLE</th><th>AUTHOR</th><th>GENRE</th><th>YEAR</th><th>VOLUMES</th><th>ACTION</th></tr></thead><tbody>${BOOKS.map(b=>`<tr><td>${esc(b.title)}</td><td>${esc(b.author)}</td><td>${b.genre}</td><td>${b.year}</td><td>${b.total}</td><td><button class="small-btn" data-edit-book="${b.id}">Edit volumes</button></td></tr>`).join('')}</tbody></table></div>`}
function systemView(){return `<div class="page-heading"><div><h1>System</h1><p>Library overview and local prototype data</p></div></div><div class="stat-grid"><div class="stat"><div class="label">Catalog titles</div><div class="num">${BOOKS.length}</div></div><div class="stat"><div class="label">Registered members</div><div class="num">${users.length}</div></div><div class="stat"><div class="label">Active loans</div><div class="num">${loans.filter(l=>l.status!=='Returned').length}</div></div><div class="stat"><div class="label">Active holds</div><div class="num">${holds.filter(h=>h.status==='Hold').length}</div></div></div><div class="card"><h3>Prototype storage</h3><p>This browser demo saves account and transaction changes in this browser's local storage. It does not use a shared database or send real email.</p><button class="small-btn danger" id="reset-data">Reset demo transactions</button></div>`}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.authTab=b.dataset.tab;if(state.authTab==='create'&&state.role==='Admin')state.role='Student';render()});document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{state.role=b.dataset.role;render()});document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>{let d=DEMOS[b.dataset.demo];state.role=d.role;state.email=d.email;render();let f=document.querySelector('#auth-form');if(f){f.email.value=d.email;f.password.value=d.password}});let form=document.querySelector('#auth-form');if(form)form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form),email=fd.get('email').trim().toLowerCase(),password=fd.get('password');let err=document.getElementById('auth-error');if(state.authTab==='create'){let name=fd.get('name').trim();if(password!==fd.get('confirm')){err.innerHTML='<div class="error">Passwords do not match.</div>';return}if(!/[A-Z]/.test(password)||!/[a-z]/.test(password)||!/[0-9]/.test(password)||password.length<8){err.innerHTML='<div class="error">Use at least 8 characters with uppercase, lowercase, and a number.</div>';return}if(state.role==='Admin'){err.innerHTML='<div class="error">Admin accounts are invitation only.</div>';return}if(users.some(u=>u.email.toLowerCase()===email)){err.innerHTML='<div class="error">An account with this email already exists. Please sign in.</div>';return}state.pendingUser={name,email,password,role:state.role};state.verifyEmail=email;state.verifyCode=String(Math.floor(100000+Math.random()*900000));state.screen='verify';render();return}let user=users.find(u=>u.email.toLowerCase()===email&&u.password===password&&u.role===state.role);if(!user){err.innerHTML='<div class="error">Those credentials do not match a '+state.role.toLowerCase()+' account. Try a demo account on the left.</div>';return}state.pendingUser=user;state.verifyEmail=email;state.verifyCode='273549';state.screen='verify';render()};let google=document.getElementById('google');if(google)google.onclick=()=>toast('Google sign-in is a demo placeholder. Use email credentials to sign in.');let vf=document.getElementById('verify-form');if(vf)vf.onsubmit=e=>{e.preventDefault();let code=new FormData(vf).get('code');if(code!==state.verifyCode){document.getElementById('verify-error').innerHTML='<div class="error">Incorrect code. Check the demo verification code above.</div>';return}if(state.pendingUser?.password&& !users.some(u=>u.email.toLowerCase()===state.pendingUser.email.toLowerCase()))users.push(state.pendingUser);persist();state.user=state.pendingUser;state.pendingUser=null;state.screen='app';state.section='Catalog';state.query='';state.genre='All';render();toast('Welcome to Aldersgate Municipal Library.')};let back=document.getElementById('back-signin');if(back)back.onclick=()=>showAuth('signin');let resend=document.getElementById('resend');if(resend)resend.onclick=()=>toast('Demo code remains '+state.verifyCode);document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{state.section=b.dataset.section;state.query='';state.genre='All';render()});let signout=document.getElementById('signout');if(signout)signout.onclick=()=>showAuth('signin');document.querySelectorAll('[data-genre]').forEach(b=>b.onclick=()=>{state.genre=b.dataset.genre;render()});let search=document.getElementById('search');if(search){search.oninput=()=>{let pos=search.selectionStart;state.query=search.value;let tb=document.querySelector('.table-wrap');let keep=tb?.scrollTop;let old=search.value;document.querySelectorAll('.filter').forEach(x=>{if(x.dataset.genre)x.classList.toggle('active',x.dataset.genre===state.genre)});let newRows=BOOKS.filter(b=>(state.genre==='All'||b.genre===state.genre)&&(!state.query||(b.title+' '+b.author).toLowerCase().includes(state.query.toLowerCase())));let body=document.querySelector('.data-table tbody');body.innerHTML=newRows.length?newRows.map(b=>`<tr><td><div class="bookcell"><span class="bookcover" style="background:${b.cover}"></span><span>${esc(b.title)}</span></div></td><td>${esc(b.author)}</td><td><span class="genre">${b.genre}</span></td><td>${b.year}</td><td>${available(b)>0?`<span class="status ok">${available(b)}/${b.total}</span>`:statusTag('On Loan')}</td>${state.user.role==='Admin'?`<td><button class="small-btn" data-book-detail="${b.id}">Manage</button></td>`:''}</tr>`).join(''):'<tr><td colspan="6" class="empty">No titles match your search.</td></tr>';document.querySelectorAll('[data-book-detail]').forEach(x=>x.onclick=()=>openBookModal(x.dataset.bookDetail));};}
document.querySelectorAll('[data-loan-filter]').forEach(b=>b.onclick=()=>{state.loanFilter=b.dataset.loanFilter;render()});document.querySelectorAll('[data-return]').forEach(b=>b.onclick=()=>{let l=loans.find(x=>x.id===b.dataset.return);if(l){l.status='Returned';persist();render();toast('Book marked as returned.')}});document.querySelectorAll('[data-cancel-hold]').forEach(b=>b.onclick=()=>{holds=holds.filter(h=>h.id!==b.dataset.cancelHold);persist();render();toast('Reservation cancelled.')});document.querySelectorAll('[data-remove-member]').forEach(b=>b.onclick=()=>{let email=b.dataset.removeMember;if(confirm('Remove this member account?')){users=users.filter(u=>u.email!==email);persist();render();toast('Member removed.')}});let ms=document.getElementById('member-search');if(ms)ms.oninput=()=>{document.getElementById('members-body').innerHTML=memberRows(users.filter(u=>(u.name+' '+u.email).toLowerCase().includes(ms.value.toLowerCase())));bind()};document.querySelectorAll('[data-edit-book],[data-book-detail]').forEach(b=>b.onclick=()=>openBookModal(b.dataset.editBook||b.dataset.bookDetail));let add=document.getElementById('add-book');if(add)add.onclick=()=>openBookModal(null);let nl=document.getElementById('new-loan');if(nl)nl.onclick=()=>openLoanModal();let reset=document.getElementById('reset-data');if(reset)reset.onclick=()=>{if(confirm('Reset all loans and reservations to the demo defaults?')){loans=[{id:'C008',bookId:'B004',member:'Callum Firth',email:DEMOS.Student.email,checked:'2026-09-18',due:'2026-10-02',status:'On Loan'},{id:'C002',bookId:'B005',member:'Prof. Jan Horáček',email:DEMOS.Teacher.email,checked:'2026-08-27',due:'2026-09-10',status:'Overdue'}];holds=[{id:'H001',bookId:'B008',member:'Prof. Jan Horáček',email:DEMOS.Teacher.email,reserved:'2026-09-15',expires:'2026-09-22',status:'Hold'}];persist();render()}}}
function openBookModal(id){let b=id?bookBy(id):{title:'',author:'',genre:'Fiction',year:new Date().getFullYear(),total:1};document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop"><form class="modal" id="book-form"><h2>${id?'Edit book volumes':'Add catalog title'}</h2>${id?'':`<label class="field"><span class="mono">TITLE</span><input name="title" required value="${esc(b.title)}"></label><label class="field"><span class="mono">AUTHOR</span><input name="author" required value="${esc(b.author)}"></label><label class="field"><span class="mono">GENRE</span><select name="genre">${['Fiction','Philosophy','Nature','Mystery'].map(g=>`<option ${b.genre===g?'selected':''}>${g}</option>`).join('')}</select></label><label class="field"><span class="mono">YEAR</span><input name="year" type="number" min="1000" max="2100" required value="${b.year}"></label>`}<label class="field"><span class="mono">TOTAL VOLUMES</span><input name="total" type="number" min="${id?bookLoans(id):1}" max="99" required value="${b.total}"></label><div class="modal-actions"><button type="button" class="secondary" id="modal-cancel">Cancel</button><button class="primary" type="submit">Save changes</button></div></form></div>`;document.getElementById('modal-cancel').onclick=()=>document.getElementById('modal-root').innerHTML='';document.getElementById('book-form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(id)b.total=Number(f.get('total'));else BOOKS.push({id:'B'+String(BOOKS.length+1).padStart(3,'0'),title:f.get('title'),author:f.get('author'),genre:f.get('genre'),year:Number(f.get('year')),total:Number(f.get('total')),cover:['#4c3829','#2f4b24','#203f61','#70233f'][BOOKS.length%4]});document.getElementById('modal-root').innerHTML='';render();toast('Catalog saved.')}}
function openLoanModal(){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop"><form class="modal" id="loan-form"><h2>Check out a book</h2><label class="field"><span class="mono">BOOK</span><select name="book" required>${BOOKS.map(b=>`<option value="${b.id}" ${available(b)===0?'disabled':''}>${esc(b.title)} (${available(b)} available)</option>`).join('')}</select></label><label class="field"><span class="mono">MEMBER EMAIL</span><input name="email" type="email" required placeholder="member@email.com"></label><label class="field"><span class="mono">DUE DATE</span><input name="due" type="date" required value="${new Date(Date.now()+14*86400000).toISOString().slice(0,10)}"></label><div class="modal-actions"><button type="button" class="secondary" id="modal-cancel">Cancel</button><button class="primary" type="submit">Check out</button></div></form></div>`;document.getElementById('modal-cancel').onclick=()=>document.getElementById('modal-root').innerHTML='';document.getElementById('loan-form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),u=users.find(u=>u.email.toLowerCase()===f.get('email').toLowerCase()),bid=f.get('book');if(!u){toast('No member found with that email.');return}if(available(bookBy(bid))<1){toast('No copies currently available.');return}loans.push({id:'C'+String(Date.now()).slice(-4),bookId:bid,member:u.name,email:u.email,checked:new Date().toISOString().slice(0,10),due:f.get('due'),status:'On Loan'});persist();document.getElementById('modal-root').innerHTML='';render();toast('Checkout recorded.')}}
render();
</script>
</body></html>
